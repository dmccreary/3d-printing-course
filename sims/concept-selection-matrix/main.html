<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="schema" content="https://dmccreary.github.io/intelligent-textbooks/ns/microsim/v1">
    <title>Concept Selection Matrix</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f4f8; font-size: 13px; }
        #container { max-width: 900px; margin: 0 auto; padding: 10px; }
        h2 { text-align: center; color: #1a3a6c; font-size: 17px; margin-bottom: 8px; }
        .subtitle { text-align: center; color: #666; font-size: 12px; margin-bottom: 10px; }

        /* Matrix table */
        #matrix-wrap { overflow-x: auto; margin-bottom: 10px; }
        table { border-collapse: collapse; width: 100%; background: white; }
        th, td { border: 1px solid #ccc; padding: 4px 6px; text-align: center; }
        th { background: #1a3a6c; color: white; font-size: 12px; }
        td.crit-cell { text-align: left; }
        td.crit-cell input { width: 100%; border: none; font-size: 12px; background: transparent; }
        td input[type=number] { width: 44px; border: none; text-align: center; font-size: 13px; background: transparent; }
        td input[type=number]:focus, td input[type=text]:focus { outline: 2px solid #1565C0; border-radius: 2px; }
        .total-row td { font-weight: bold; background: #e8f0fe; }
        .winner { background: #c8e6c9 !important; }
        .second { background: #fff9c4 !important; }
        .col-hover { background: #e3f2fd; }
        .rank-cell { font-size: 11px; }

        /* Controls */
        #controls { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
        button { padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: 600; }
        .btn-add  { background: #1565C0; color: white; }
        .btn-add:hover  { background: #0d47a1; }
        .btn-reset { background: #e53935; color: white; }
        .btn-reset:hover { background: #b71c1c; }
        .btn-csv  { background: #2e7d32; color: white; }
        .btn-csv:hover { background: #1b5e20; }
        .btn-del  { background: #78909c; color: white; font-size: 11px; padding: 4px 8px; }

        /* Chart */
        #chart-wrap { background: white; border: 1px solid #ddd; border-radius: 6px; padding: 10px; }
        #chart-title { text-align: center; font-size: 13px; font-weight: 600; color: #333; margin-bottom: 6px; }
        canvas#barchart { display: block; width: 100%; }
    </style>
</head>
<body>
<div id="container">
    <h2>Concept Selection Matrix</h2>
    <p class="subtitle">Weighted decision matrix for design concept evaluation — pre-loaded with a phone-stand example</p>

    <div id="controls">
        <button class="btn-add" onclick="addConcept()">+ Add Concept</button>
        <button class="btn-add" onclick="addCriterion()">+ Add Criterion</button>
        <button class="btn-reset" onclick="resetMatrix()">↺ Reset to Example</button>
        <button class="btn-csv" onclick="downloadCSV()">⬇ Download CSV</button>
    </div>

    <div id="matrix-wrap"></div>
    <div id="chart-wrap">
        <div id="chart-title">Weighted Total Scores</div>
        <canvas id="barchart" height="140"></canvas>
    </div>
</div>
<script src="concept-selection-matrix.js"></script>
</body>
</html>
