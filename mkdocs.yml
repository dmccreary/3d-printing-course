# Intelligent Textbook — MkDocs Material configuration.
# Generated by the init-textbook skill. Customize as the book grows.
# Use the book-installer skill to add features incrementally
# (math, mascot, slides, learning graph viewer, etc.).

site_name: 'Introduction to 3D Printing'
site_description: 'An interactive intelligent textbook with MicroSims to teach high-school students about 3D printing, designed to maximize the probability of college credit.'
site_author: 'Dan McCreary'
site_url: 'https://dmccreary.github.io/3d-printing-course/'

# Repository
repo_name: 'GitHub Repo'
repo_url: 'https://github.com/dmccreary/3d-printing-course'
edit_uri: 'blob/main/docs'


