<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="schema" content="https://dmccreary.github.io/intelligent-textbooks/ns/microsim/v1">
    <title>Metal AM Build-to-Part Workflow</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vis-network/9.1.9/standalone/umd/vis-network.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #f5f5f5; }
        #title {
            text-align: center;
            padding: 10px 14px;
            font-size: 17px;
            font-weight: 600;
            color: #1a3a6c;
            background: #e8f0fe;
            border-bottom: 1px solid #c5d5f5;
        }
        #network {
            width: 100%;
            height: 200px;
            background: #fafbff;
            border-bottom: 1px solid #ddd;
        }
        #detail-panel {
            min-height: 220px;
            padding: 14px 20px;
            background: #fff;
            font-size: 13px;
            line-height: 1.55;
        }
        #detail-panel h3 {
            font-size: 15px;
            color: #1a3a6c;
            margin-bottom: 10px;
        }
        .detail-grid {
            display: grid;
            grid-template-columns: 140px 1fr;
            gap: 5px 10px;
        }
        .det-label { font-weight: 600; color: #555; }
        .det-warn  { color: #b71c1c; }
        #hint {
            color: #888;
            font-size: 12px;
            text-align: center;
            padding: 6px;
        }
    </style>
</head>
<body>
    <div id="title">Metal AM Build-to-Part Workflow — Click any step</div>
    <div id="network"></div>
    <div id="detail-panel">
        <div id="hint">Click any workflow step above to see details, equipment, QC checks, and common failure modes.</div>
    </div>
    <script src="metal-am-workflow.js"></script>
</body>
</html>
