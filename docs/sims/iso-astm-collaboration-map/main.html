<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="schema" content="https://dmccreary.github.io/intelligent-textbooks/ns/microsim/v1">
    <title>ISO & ASTM Collaboration Map</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vis-network/9.1.9/standalone/umd/vis-network.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f4f8; }
        #title {
            text-align: center;
            padding: 10px;
            font-size: 18px;
            font-weight: 600;
            color: #1a3a6c;
            background: #e8f0fe;
            border-bottom: 1px solid #c5d5f5;
        }
        #layout {
            display: flex;
            height: 430px;
        }
        #network {
            flex: 1;
            background: #f8fbff;
        }
        #info-panel {
            width: 260px;
            background: #fff;
            border-left: 1px solid #dce8f8;
            padding: 14px;
            overflow-y: auto;
            font-size: 13px;
        }
        #info-panel h3 {
            font-size: 15px;
            color: #1a3a6c;
            margin-bottom: 8px;
            border-bottom: 2px solid #1565C0;
            padding-bottom: 4px;
        }
        .info-row { margin: 6px 0; line-height: 1.4; }
        .info-label { font-weight: 600; color: #555; }
        #legend {
            display: flex;
            gap: 16px;
            padding: 6px 14px;
            background: #fff;
            border-top: 1px solid #ddd;
            font-size: 12px;
            align-items: center;
        }
        .leg-dot {
            display: inline-block;
            width: 12px; height: 12px;
            border-radius: 50%;
            margin-right: 4px;
            vertical-align: middle;
        }
        #toggle-btn {
            margin-left: auto;
            padding: 4px 10px;
            background: #1565C0;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
        #toggle-btn:hover { background: #0d47a1; }
    </style>
</head>
<body>
    <div id="title">ISO / ASTM AM Standards Collaboration Map</div>
    <div id="layout">
        <div id="network"></div>
        <div id="info-panel">
            <h3>Node Details</h3>
            <p style="color:#777; font-size:12px;">Click any node to see details about that organization or standard.</p>
        </div>
    </div>
    <div id="legend">
        <span><span class="leg-dot" style="background:#1565C0;"></span>ISO TC 261</span>
        <span><span class="leg-dot" style="background:#C62828;"></span>ASTM F42</span>
        <span><span class="leg-dot" style="background:#6A1B9A;"></span>Joint Agreement / Standard</span>
        <button id="toggle-btn">Focus: Terminology</button>
    </div>
    <script src="iso-astm-collaboration-map.js"></script>
</body>
</html>
